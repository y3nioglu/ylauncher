# Otomatik surum yayini: v* tag'i itildiginde Windows paketi derler ve
# GitHub Releases'e yukler (draft DEGIL — direkt yayinda).
#
# Kullanim akisi:
#   npm run release:prep     -> surum artirir + commit + tag (v0.1.4) + push
#   GitHub Actions calisir   -> 3-6 dk icinde release yayinda
#
# Notlar:
# - GITHUB_TOKEN yetkileri workflow icinde verilir; personal access token gerekmez.
# - electron-builder --publish always: exe + latest.yml + blockmap'i release
#   asset'leri olarak yukler; kurulu launcher'lar bir sonraki acilista bulur.
# - electron'un postinstall script'i izin gerektirdiginden npm ci yerine
#   npm install --ignore-scripts kullanilir; electron-builder indirme isi
#   Electron Builder binaries action cache'i ile hizlanir.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # release olusturma + asset yukleme icin sart

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Electron Builder cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build app bundle (electron-vite)
        run: npm run build

      # electron-builder'in kendi GitHub publish'i ayni tag icin TWO ayri
      # release nesnesi olusturabiliyor (blockmap biri, exe+yml digerinde) —
      # updater 'latest' release'e dusup latest.yml'i bulamayip 404 veriyor
      # (sahada 0.1.6-0.1.8'de yasandi). Bu yuzden paketleme publish'siz
      # yapilir; yuklemeyi asagidaki action TEK release'e yapar.
      - name: Package (no publish)
        run: npx electron-builder --win --publish never

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish release (single, all assets)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MC Friends Launcher ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release/${{ steps.ver.outputs.version }}/*.exe
            release/${{ steps.ver.outputs.version }}/latest.yml
            release/${{ steps.ver.outputs.version }}/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-context
          path: |
            package.json
            electron.vite.config.ts
          retention-days: 7
